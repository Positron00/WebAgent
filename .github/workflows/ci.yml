name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      # Git LFS files stay as pointer files (lfs: false is the default).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies only; see backend/SECURITY_DEPENDENCIES.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check-types
      - run: npm run test:coverage
      # src/config/env.ts needs a TOGETHER_API_KEY of at least 32 characters at build time.
      # This placeholder is never used for a call.
      - run: npm run build
        env:
          TOGETHER_API_KEY: ci-placeholder-key-not-used-000000000000

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/requirements-dev.txt
      # The CPU wheel index keeps torch to the small CPU build.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      # NLTK data the document agent loads when it's built; the Docker image installs the same
      # list. The tests turn NLTK auto-download off, so it must be here before they run.
      - run: python -m nltk.downloader -q punkt punkt_tab stopwords wordnet maxent_ne_chunker words
      - run: ruff check backend
      # Known advisories in the exact versions; the ignored ones are explained in backend/SECURITY_DEPENDENCIES.md.
      - run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/constraints.txt --no-deps --progress-spinner off \
            --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-2192 --ignore-vuln PYSEC-2026-2556 --ignore-vuln PYSEC-2026-2193 \
            --ignore-vuln PYSEC-2026-2562 --ignore-vuln PYSEC-2026-76 --ignore-vuln PYSEC-2026-77 \
            --ignore-vuln PYSEC-2026-83 --ignore-vuln PYSEC-2026-1527 --ignore-vuln PYSEC-2026-2573 \
            --ignore-vuln PYSEC-2026-2574 --ignore-vuln PYSEC-2026-2194 --ignore-vuln PYSEC-2026-2575 \
            --ignore-vuln PYSEC-2026-4240 --ignore-vuln PYSEC-2026-3740 --ignore-vuln PYSEC-2026-4164 \
            --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288 --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174
      - run: python -m pytest backend/tests -q -m "not needs_lfs and not real_triage_model" --cov=backend/app --cov-report=term --cov-fail-under=50

  # Browser to backend: sign-in, a research run on the fake model, Track this, Run now through the
  # scheduler, and email subscribe/confirm/unsubscribe through a local SMTP sink (scripts/e2e/).
  # Git LFS weights are pointer files here; the backend runs in dev, where triage and the guard fall back.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/requirements-dev.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: python -m nltk.downloader -q punkt punkt_tab stopwords wordnet maxent_ne_chunker words
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e/stack.sh start
      - run: npx playwright test
      - if: always()
        run: scripts/e2e/stack.sh stop
      # Logs and traces only; .e2e/env holds the run's throwaway secrets and stays out.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
            .e2e/logs/
          retention-days: 7
