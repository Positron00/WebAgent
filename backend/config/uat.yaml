# WebAgent UAT Environment Configuration

# API settings
api:
  version: "v1"
  prefix: "/api/v1"
  debug_mode: false
  host: "0.0.0.0"
  port: 8000

# CORS settings
cors:
  origins:
    - "https://uat.webagent.example.com"
    - "https://uat-admin.webagent.example.com"
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# Database settings
database:
  vector_db:
    # Path can be overridden with WEBAGENT_VECTOR_DB_PATH environment variable
    path: ""  # Will use settings.VECTOR_DB_PATH
    embedding_dimension: 1536
    distance_metric: "cosine"
# LLM settings
llm:
  price_input_per_million: 0.35    # $ per million tokens, the configured Together model (2026-10-16)
  price_output_per_million: 1.50
  provider: "together"
  default_model: "meta-models/Muse-Glimmer-30B"
  temperature: 0.5
  timeout_seconds: 90
  max_tokens: 8192
  retry_attempts: 3
  batch_size: 20

# LangSmith settings for observability
langsmith:
  project_name: "webagent-research-uat"
  tracing_enabled: true
  log_level: "INFO"

# Web search settings
web_search:
  provider: "tavily"
  search_depth: "comprehensive"
  max_results: 15
  include_domains: []
  exclude_domains: []
  timeout_seconds: 60

# Task management
tasks:
  max_concurrent: 20
  result_ttl_minutes: 120
  history_ttl_days: 14
  max_retries: 3

# Agents configuration
agents:
  supervisor:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.2
  web_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.3
    max_searches_per_task: 5
    # One analysis of the search results (plus any reasoning the model writes first);
    # the cap keeps a runaway generation short. Real replies use about 1,900-3,000 tokens.
    max_tokens: 4096
  internal_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.1
    max_documents: 20
  senior_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.2
    max_follow_up_questions: 3
  data_analysis:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.1
  coding:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.0
    allowed_modules: ["matplotlib", "seaborn", "numpy", "pandas"]
    timeout_seconds: 30
  team_manager:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.4

security_guard:
  enabled: true
  input_mode: shadow
  tool_mode: shadow
  judge: false
  harm_judge: moderation   # OpenAI moderation (needs OPENAI_API_KEY); or llm / off
  jailbreak_judge: llm      # trusted chat model; or off
  plan_check: true         # check agent subgoals against the user's turns (checkpoint2-intent; rules shadow-only)
  collect: true            # shadow week: decisions with scores for review (no text outside dev; 30-day retention)

triage:
  # Shadow week (2026-10-13), alongside the security guard's: for questions sent with Agentic set to
  # Always, triage classifies each one and records what it would have done; their routing is unchanged.
  # Shadow mode doesn't cover Auto: with enabled: true, Auto routes by triage for real and /api/triage
  # records nothing, so send the week's questions with Always. Collection stores question text for the
  # review (30-day retention). After the review, task 3.11 sets mode: act.
  enabled: true
  mode: shadow
  collect: true
  llm_tiebreak: false

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_to_file: true
  log_file: "/var/log/webagent/webagent-uat.log"
  rotate_logs: true
  max_file_size_mb: 20
  backup_count: 10

# Security settings
security:
  api_key_enabled: true
  token_expire_minutes: 30
  algorithm: "HS256"
  password_min_length: 10

# Recurring research (recurring-research spec). Off until an operator turns it on after shadow week 2
# (RNFR-05); the scheduler runs as its own process (python -m app.scheduler).
schedule:
  enabled: false
  max_active_topics: 10
  max_runs_per_day: 20
  max_concurrent_runs: 2
  history_runs_kept: 20
  pause_after_failures: 3
  paused_topic_days: 90
  monthly_tavily_credits: 400
  monthly_together_usd: 5.0
  token_budget_default: 60000    # set to 1.5 x p90 of shadow week 2's tokens_used (task A0)
  max_token_budget: 200000

notifications:
  email:
    enabled: false
    transport: log               # log (writes the message to the log) | smtp
    mode: notice                 # notice | summary (summary needs security_guard.input_mode: act)
    max_subscribers_per_topic: 5
    max_emails_per_day: 50

