# Offline policy table (SEC-014). Each row is evaluated through decide() at load time.
tests:
  - name: baseline allow user turn
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
    expected: allow

  - name: baseline allow agent output
    principal: senior_research
    action: converse
    resource: task-1
    context:
      source: agent_output
      injection: 10
    expected: allow

  - name: untrusted injection watch
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: web_result
      injection: 25
    expected: verify

  - name: untrusted injection drop score
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: web_result
      injection: 45
    expected: decline

  - name: untrusted injection drop pattern
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: document
      pattern_hits: [injection_phrase]
    expected: decline

  - name: user harm decline
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 90
    expected: decline

  - name: user jailbreak consent
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      jailbreak: 75
      harm: 10
    expected: consent

  - name: user jailbreak consented
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      jailbreak: 75
      harm: 10
      consented: true
    expected: allow

  - name: search secret decline
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      pattern_hits: [api_key]
    expected: decline

  - name: tainted search verify
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      tainted: true
      alignment: 40
    expected: verify

  - name: tainted code consent
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      tainted: true
      code_execution_enabled: true
    expected: consent

  - name: tainted code approved
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      tainted: true
      code_execution_enabled: true
      approved_tools: [tool::execute_code]
    expected: allow

  - name: repeated declines escalate
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      declined_actions_in_task: 3
    expected: escalate

  - name: classifier down untrusted verify
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: web_result
      scores_available: false
    expected: verify

  - name: classifier down user turn allow
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      scores_available: false
    expected: allow

  - name: document provenance decline
    principal: document_extraction
    action: tool::document_extract
    resource: task-1
    context:
      source: tool
      pattern_hits: [document_provenance]
    expected: decline

  - name: search personal data verify
    principal: internal_research
    action: tool::internal_retrieve
    resource: task-1
    context:
      source: tool
      pattern_hits: [email]
    expected: verify

  - name: search url verify
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      pattern_hits: [site_operator]
    expected: verify

  - name: code dangerous decline
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      code_findings: [process]
      code_execution_enabled: true
    expected: decline

  - name: code disabled decline
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      code_execution_enabled: false
    expected: decline

  - name: severity decline over verify
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: web_result
      injection: 45
      scores_available: false
    expected: decline

  - name: severity escalate over decline
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      pattern_hits: [api_key]
      declined_actions_in_task: 3
    expected: escalate

  - name: network code consent
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      code_findings: [network]
      code_execution_enabled: true
    expected: consent

  # Thresholds come from the loaded model's metadata (thresholds.py); these rows use non-default ones.
  - name: harm decline at a model threshold
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 93
      harm_decline_at: 92
    expected: decline

  - name: harm below a model decline threshold is verified
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 91
      harm_decline_at: 92
    expected: verify

  - name: harm below a model verify threshold
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 70
      harm_verify_at: 75
      harm_decline_at: 92
    expected: allow

  - name: injection watch band follows the model thresholds
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: web_result
      injection: 45
      injection_watch_at: 30
      injection_drop_at: 60
    expected: verify

  - name: user harm verify band goes to the judge
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 60
    expected: verify

  - name: history harm verify band
    principal: web_research
    action: converse
    resource: task-1
    context:
      source: history
      harm: 60
    expected: verify

  - name: user jailbreak verify band
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      jailbreak: 55
    expected: verify

  - name: user harm below the verify band
    principal: intake
    action: converse
    resource: task-1
    context:
      source: user_turn
      harm: 30
      jailbreak: 30
    expected: allow

  - name: search far from the task text (old rule removed) records nothing
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      alignment: 12
    expected: allow
    expected_shadow: []

  - name: misaligned search in a tainted task is verified, the shadow rule still recorded
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      alignment: 12
      tainted: true
    expected: verify
    expected_shadow: []

  # Checkpoint 2 against the user's intent (checkpoint2-intent spec SEC-109): every new rule is shadow-only,
  # so each row expects allow and lists the shadow match.
  - name: intent - drifted rewrite recorded
    principal: supervisor
    action: plan::rewrite
    resource: task-1
    context:
      source: plan
      rewrite_alignment: 20
    expected: allow
    expected_shadow: [rewrite-drift-verify]

  - name: intent - rewrite at its threshold not recorded
    principal: supervisor
    action: plan::rewrite
    resource: task-1
    context:
      source: plan
      rewrite_alignment: 40
    expected: allow
    expected_shadow: []

  - name: intent - no signals, no rewrite match
    principal: supervisor
    action: plan::rewrite
    resource: task-1
    context:
      source: plan
      rewrite_alignment: 5
      signals_available: false
    expected: allow
    expected_shadow: []

  - name: intent - harmful subgoal under a benign intent recorded
    principal: senior_research
    action: plan::subgoal
    resource: task-1
    context:
      source: plan
      subgoal_harm: 90
      intent_harm: 5
      subgoal_origin: follow_up
    expected: allow
    expected_shadow: [subgoal-harm-decline]

  - name: intent - harmful subgoal under an already harmful intent not this rule
    principal: senior_research
    action: plan::subgoal
    resource: task-1
    context:
      source: plan
      subgoal_harm: 90
      intent_harm: 60
    expected: allow
    expected_shadow: []

  - name: intent - off-intent subgoal recorded
    principal: supervisor
    action: plan::subgoal
    resource: task-1
    context:
      source: plan
      intent_alignment: 10
    expected: allow
    expected_shadow: [subgoal-off-intent-decline]

  - name: intent - on-intent subgoal records nothing
    principal: supervisor
    action: plan::subgoal
    resource: task-1
    context:
      source: plan
      intent_alignment: 15
    expected: allow
    expected_shadow: []

  - name: intent - much riskier search recorded by both risk rules
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      risk_above_intent: 70
    expected: allow
    expected_shadow: [call-risk-above-intent-decline, call-risk-above-intent-verify]

  - name: intent - somewhat riskier code recorded by the verify rule
    principal: coding_review
    action: tool::execute_code
    resource: task-1
    context:
      source: tool
      risk_above_intent: 35
      code_execution_enabled: true
      sandbox: docker
    expected: allow
    expected_shadow: [call-risk-above-intent-verify]

  - name: intent - risk just under verify records nothing
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      risk_above_intent: 29
    expected: allow
    expected_shadow: []

  - name: intent - off-intent search recorded tainted or not
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      intent_alignment: 12
      alignment: 80
    expected: allow
    expected_shadow: [off-intent-search-verify]

  - name: intent - off-intent retrieval recorded
    principal: internal_research
    action: tool::internal_retrieve
    resource: task-1
    context:
      source: tool
      intent_alignment: 24
    expected: allow
    expected_shadow: [off-intent-search-verify]

  - name: intent - search at the threshold records nothing
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      intent_alignment: 25
    expected: allow
    expected_shadow: []

  - name: intent - search copying private text recorded
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      egress_overlap: 12
    expected: allow
    expected_shadow: [private-egress-decline]

  - name: intent - seven shared words is not egress
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      egress_overlap: 7
    expected: allow
    expected_shadow: []

  - name: intent - undeclared retrieval recorded
    principal: internal_research
    action: tool::internal_retrieve
    resource: task-1
    context:
      source: tool
      declared: false
    expected: allow
    expected_shadow: [undeclared-tool-verify]

  - name: intent - undeclared document read recorded
    principal: document_extraction
    action: tool::document_extract
    resource: task-1
    context:
      source: tool
      declared: false
    expected: allow
    expected_shadow: [undeclared-tool-verify]

  - name: intent - third off-intent call recorded as drift
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      low_alignment_calls: 3
    expected: allow
    expected_shadow: [drift-escalate]

  - name: intent - drift also stops follow-up subgoals
    principal: senior_research
    action: plan::subgoal
    resource: task-1
    context:
      source: plan
      low_alignment_calls: 4
    expected: allow
    expected_shadow: [drift-escalate]

  - name: intent - two off-intent calls is not drift
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      low_alignment_calls: 2
    expected: allow
    expected_shadow: []

  - name: intent - no signals, no alignment or risk match
    principal: web_research
    action: tool::web_search
    resource: task-1
    context:
      source: tool
      signals_available: false
      intent_alignment: 0
      risk_above_intent: 100
    expected: allow
    expected_shadow: []
