# WebAgent Production Environment Configuration

# API settings
api:
  version: "v1"
  prefix: "/api/v1"
  debug_mode: false
  host: "0.0.0.0"
  port: 8000

# CORS settings
cors:
  origins:
    - "https://webagent.example.com"
    - "https://api.webagent.example.com"
    - "https://admin.webagent.example.com"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization", "X-Requested-With", "X-API-Key"]

# Database settings
database:
  vector_db:
    # Path can be overridden with WEBAGENT_VECTOR_DB_PATH environment variable
    path: ""  # Will use settings.VECTOR_DB_PATH
    embedding_dimension: 1536
    distance_metric: "cosine"
# LLM settings
llm:
  price_input_per_million: 0.35    # $ per million tokens, the configured Together model (2026-10-16)
  price_output_per_million: 1.50
  provider: "together"
  default_model: "meta-models/Muse-Glimmer-30B"
  temperature: 0.3
  timeout_seconds: 120
  max_tokens: 16384
  retry_attempts: 5
  batch_size: 50

# LangSmith settings for observability
langsmith:
  project_name: "webagent-research-prod"
  tracing_enabled: true
  log_level: "WARNING"

# Web search settings
web_search:
  provider: "tavily"
  search_depth: "comprehensive"
  max_results: 20
  include_domains: []
  exclude_domains: []
  timeout_seconds: 90

# Task management
tasks:
  max_concurrent: 50
  result_ttl_minutes: 240
  history_ttl_days: 30
  max_retries: 5

# Agents configuration
agents:
  supervisor:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.2
  web_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.3
    max_searches_per_task: 10
    # One analysis of the search results (plus any reasoning the model writes first);
    # the cap keeps a runaway generation short. Real replies use about 1,900-3,000 tokens.
    max_tokens: 4096
  internal_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.1
    max_documents: 50
  senior_research:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.2
    max_follow_up_questions: 5
  data_analysis:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.1
  coding:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.0
    allowed_modules: ["matplotlib", "seaborn", "numpy", "pandas"]
    timeout_seconds: 60
  team_manager:
    model: "meta-models/Muse-Glimmer-30B"
    temperature: 0.4
  topic_summary:
    model: "meta-models/Muse-Glimmer-30B"
    # The change summary between two scheduled runs: at most 5 bullets (REC-130).
    max_tokens: 600

security_guard:
  enabled: true
  input_mode: shadow
  tool_mode: shadow
  judge: false
  harm_judge: moderation   # OpenAI moderation (needs OPENAI_API_KEY); or llm / off
  jailbreak_judge: llm      # trusted chat model; or off
  plan_check: true         # check agent subgoals against the user's turns (checkpoint2-intent; rules shadow-only)
  collect: false

triage:
  # Off until a classifier version passes the release gate (REQ-023); Auto then acts like Always.
  enabled: false
  mode: act
  collect: false
  llm_tiebreak: false

# Logging configuration
logging:
  level: "WARNING"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_to_file: true
  log_file: "/var/log/webagent/webagent-prod.log"
  rotate_logs: true
  max_file_size_mb: 50
  backup_count: 20

# Security settings
security:
  token_expire_minutes: 15
  algorithm: "HS256"
  password_min_length: 12
  api_key_enabled: true

# Recurring research (recurring-research spec). Off until an operator turns it on after shadow week 2
# (RNFR-05); the scheduler runs as its own process (python -m app.scheduler).
schedule:
  enabled: false
  max_active_topics: 10
  max_runs_per_day: 20
  max_concurrent_runs: 2
  history_runs_kept: 20
  pause_after_failures: 3
  paused_topic_days: 90
  monthly_tavily_credits: 400
  monthly_together_usd: 5.0
  token_budget_default: 60000    # set to 1.5 x p90 of shadow week 2's tokens_used (task A0)
  max_token_budget: 200000

notifications:
  email:
    enabled: false
    transport: log               # log (writes the message to the log) | smtp
    mode: notice                 # notice | summary (summary needs security_guard.input_mode: act)
    max_subscribers_per_topic: 5
    max_emails_per_day: 50

