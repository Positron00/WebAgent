# Model Services Configuration

# Global settings
gateway:
  host: localhost
  port: 8000
  log_level: info

# Default model parameters (applied to all models unless overridden)
default_parameters:
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repetition_penalty: 1.1

# Model definitions
models:
  # Example of a local transformer model
  llama2-7b:
    display_name: "Llama 2 (7B)"
    model_type: llm
    model_path: "models/llama2/7B"
    device: "cuda:0"
    host: localhost
    port: 8501
    capabilities:
      - text-generation
      - chat
    parameters:
      max_new_tokens: 4096
      temperature: 0.8

  # Example of an embedding model
  e5-small:
    display_name: "E5 Small"
    model_type: embedding
    model_path: "models/e5-small-v2"
    device: "cuda:0"
    host: localhost
    port: 8502
    capabilities:
      - embeddings
    parameters:
      normalize: true
      max_length: 512

  # Example of another model type
  mistral-7b:
    display_name: "Mistral (7B)"
    model_type: llm
    model_path: "models/mistral/7B"
    device: "cuda:0"
    host: localhost
    port: 8503
    capabilities:
      - text-generation
      - chat
      - instruction-following
    parameters:
      max_new_tokens: 4096
      temperature: 0.7
      top_p: 0.95
      
  # Custom Core Transformer model implementation
  # This uses our internal Transformer implementation rather than Hugging Face
  core-transformer:
    display_name: "Core Transformer"
    model_type: llm
    model_path: "backend/models/core_transformer"
    device: "cpu"  # Can be changed to cuda:0 for GPU acceleration
    host: localhost
    port: 8504
    capabilities:
      - text-generation
      - sequence-to-sequence
    parameters:
      src_vocab_size: 5000
      tgt_vocab_size: 5000
      d_model: 512
      num_heads: 8
      num_encoder_layers: 6
      num_decoder_layers: 6
      d_ff: 2048
      dropout: 0.1
      max_seq_length: 1024
      temperature: 0.7
      top_p: 0.9 