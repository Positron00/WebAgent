apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid: the dashboards refer to it (a generated uid broke the drift dashboard).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 120s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
