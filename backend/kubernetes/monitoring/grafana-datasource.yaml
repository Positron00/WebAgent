apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      # Fixed uid: the dashboards refer to it.
      uid: prometheus
      type: prometheus
      # The prometheus-server Service listens on 9090 (prometheus.yaml); without the port Grafana tried 80.
      url: http://prometheus-server.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      editable: false
      jsonData:
        timeInterval: 15s
        queryTimeout: 120s
        httpMethod: POST
        manageAlerts: true
        prometheusType: Prometheus
      version: 1 