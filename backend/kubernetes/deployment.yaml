apiVersion: apps/v1
kind: Deployment
metadata:
  name: webagent-backend
  namespace: default
  labels:
    app: webagent-backend
    version: "3.6.0"
spec:
  # One replica: task status, results and the security/triage collection live in /app/data,
  # a ReadWriteOnce volume. To run more replicas, use a shared ReadWriteMany volume instead.
  replicas: 1
  selector:
    matchLabels:
      app: webagent-backend
  # Recreate: a ReadWriteOnce volume can't be attached to the old and new pod at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: webagent-backend
        version: "3.6.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: webagent-backend
        # deploy.sh sets the registry with -r (default: webagent/backend).
        image: webagent/backend:3.6.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Selects config/<env>.yaml; deploy.sh sets it from -e (prod or uat).
        - name: WEBAGENT_ENV
          value: "prod"
        - name: LOG_LEVEL
          value: "INFO"
        - name: WEB_CONCURRENCY
          value: "2"
        - name: WEBAGENT_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: security-secret-key
        - name: WEBAGENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: api-key
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: tavily-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: openai-api-key
        - name: TOGETHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: together-api-key
              optional: true
        - name: LANGSMITH_API_KEY
          valueFrom:
            secretKeyRef:
              name: webagent-secrets
              key: langsmith-api-key
              optional: true
        resources:
          limits:
            # Two workers each score on their own CPU thread; one core throttled both.
            cpu: "2"
            # 2 workers with triage + ContextDefender peaked at 1.81 GiB in the 3.2.4 simulated
            # shadow week (about 1.25 GiB RSS per worker); 3 GiB keeps 20% headroom (SNFR-05).
            memory: "3Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        # Loading the encoders can be slow on a throttled node; liveness waits until this passes.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        # The root filesystem is read-only; these are the folders the app writes to.
        # Config comes from the image (config/prod.yaml) plus the env vars above.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: webagent-data
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webagent-backend
  namespace: default
  labels:
    app: webagent-backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: webagent-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webagent-backend
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Public ingress must not expose Prometheus metrics (NetworkPolicy is port-wide).
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { return 404; }
spec:
  tls:
  - hosts:
    - api.webagent.example.com
    secretName: webagent-tls
  rules:
  - host: api.webagent.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webagent-backend
            port:
              name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webagent-data
  namespace: default
  labels:
    app: webagent-backend
spec:
  # Survives pod restarts and redeploys: a shadow week's collection must not be lost.
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
