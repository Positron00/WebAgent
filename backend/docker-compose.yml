# Local stack: backend + Prometheus + Grafana.
# Set secrets in backend/.env (read by docker compose, never committed):
#   WEBAGENT_SECURITY_SECRET_KEY, WEBAGENT_API_KEY, GRAFANA_ADMIN_PASSWORD, provider API keys.

services:
  webagent-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: webagent/backend:${APP_VERSION:-latest}
    container_name: webagent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - webagent-data:/app/data
    environment:
      # dev: no API key needed, debug errors on. Use uat or prod to test production settings.
      - WEBAGENT_ENV=${WEBAGENT_ENV:-dev}
      - LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - WEBAGENT_SECURITY_SECRET_KEY=${WEBAGENT_SECURITY_SECRET_KEY:-}
      - WEBAGENT_API_KEY=${WEBAGENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - webagent-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.36.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - webagent-network

  grafana:
    image: grafana/grafana:8.5.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in backend/.env}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - webagent-network
    depends_on:
      - prometheus

networks:
  webagent-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  webagent-data:
