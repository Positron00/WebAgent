# Local stack: backend + Prometheus + Grafana.
# Secrets come from the repo-root .env.local (git-ignored), the same file the app reads.
# Run from the repo root with:
#   npm run stack:up        (docker compose -f backend/docker-compose.yml --env-file .env.local up --build)
# Needed in .env.local: GRAFANA_ADMIN_PASSWORD and the provider API keys;
# WEBAGENT_SECURITY_SECRET_KEY and WEBAGENT_API_KEY too if WEBAGENT_ENV is uat or prod.
# Ports are published on 127.0.0.1 only. To reach the stack from other machines, change the
# port lines yourself and turn API keys on (WEBAGENT_SECURITY_API_KEY_ENABLED=true).

services:
  webagent-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: webagent/backend:${APP_VERSION:?set APP_VERSION, e.g. via npm run stack:up}
    container_name: webagent-backend
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - webagent-data:/app/data
    environment:
      # dev: no API key needed, debug errors on. Use uat or prod to test production settings.
      - WEBAGENT_ENV=${WEBAGENT_ENV:-dev}
      - LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - WEBAGENT_SECURITY_SECRET_KEY=${WEBAGENT_SECURITY_SECRET_KEY:-}
      - WEBAGENT_API_KEY=${WEBAGENT_API_KEY:-}
      - WEBAGENT_SCHEDULER_TOKEN=${WEBAGENT_SCHEDULER_TOKEN:-}
      # Topic email (notifications.email in config/<env>.yaml); the backend is the only sender.
      - WEBAGENT_PUBLIC_URL=${WEBAGENT_PUBLIC_URL:-}
      - WEBAGENT_SMTP_HOST=${WEBAGENT_SMTP_HOST:-}
      - WEBAGENT_SMTP_PORT=${WEBAGENT_SMTP_PORT:-}
      - WEBAGENT_SMTP_USERNAME=${WEBAGENT_SMTP_USERNAME:-}
      - WEBAGENT_SMTP_PASSWORD=${WEBAGENT_SMTP_PASSWORD:-}
      - WEBAGENT_SMTP_FROM=${WEBAGENT_SMTP_FROM:-}
      - WEBAGENT_SMTP_TLS=${WEBAGENT_SMTP_TLS:-}
      # Empty keeps notifications.email from the YAML (true/false; log/smtp; notice/summary).
      - WEBAGENT_EMAIL_ENABLED=${WEBAGENT_EMAIL_ENABLED:-}
      - WEBAGENT_EMAIL_TRANSPORT=${WEBAGENT_EMAIL_TRANSPORT:-}
      - WEBAGENT_EMAIL_MODE=${WEBAGENT_EMAIL_MODE:-}
      # Drift and alerts (3.6.0); empty means the code default.
      - TOGETHER_API_BASE=${TOGETHER_API_BASE:-}
      - WEBAGENT_DRIFT_ENABLED=${WEBAGENT_DRIFT_ENABLED:-true}
      - WEBAGENT_DRIFT_WINDOW=${WEBAGENT_DRIFT_WINDOW:-}
      - WEBAGENT_DRIFT_INTERVAL_SECONDS=${WEBAGENT_DRIFT_INTERVAL_SECONDS:-}
      - WEBAGENT_TOKEN_ALERT_DAILY=${WEBAGENT_TOKEN_ALERT_DAILY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - webagent-network
    depends_on:
      - prometheus

  # Recurring research scheduler (recurring-research spec D1): one process from the same image.
  # Idle until schedule.enabled (WEBAGENT_SCHEDULER_ENABLED=true); needs WEBAGENT_SCHEDULER_TOKEN,
  # the same value the backend gets.
  webagent-scheduler:
    image: webagent/backend:${APP_VERSION:?set APP_VERSION, e.g. via npm run stack:up}
    container_name: webagent-scheduler
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    mem_limit: 192m
    volumes:
      - ./config:/app/config
      - webagent-data:/app/data
    environment:
      - WEBAGENT_ENV=${WEBAGENT_ENV:-dev}
      - LOG_LEVEL=INFO
      - WEBAGENT_BACKEND_URL=http://webagent-backend:8000
      - WEBAGENT_API_KEY=${WEBAGENT_API_KEY:-}
      - WEBAGENT_SCHEDULER_TOKEN=${WEBAGENT_SCHEDULER_TOKEN:-}
      - WEBAGENT_SCHEDULER_ENABLED=${WEBAGENT_SCHEDULER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-m", "app.scheduler", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - webagent-network
    depends_on:
      - webagent-backend

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - webagent-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      # Host port 3001 by default: the Next.js dev server (and often a local Grafana) use 3000.
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # The dashboard provider (provisioning/dashboards/dashboards.yaml) reads this folder;
      # without this mount the stack started with no dashboards.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.local and start with npm run stack:up}
    networks:
      - webagent-network
    depends_on:
      - prometheus

networks:
  webagent-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  webagent-data:
